name: Sync and Build

# 明确授予写入权限
permissions:
  contents: write  # 允许推送代码到仓库

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      # 1. 迁出 GitHub 仓库代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 重要：需要写入权限才能 push
          token: ${{ github.token }}

      # 2. 将 Markdown 文件转换为 HTML
      - name: Convert MD to HTML
        run: |
          sudo apt-get install -y pandoc
          for app_dir in src/*; do
            app_name=$(basename "$app_dir")
            mkdir -p "dist/$app_name"
            for file in "$app_dir"/*.md; do
              if [ -f "$file" ]; then
                filename=$(basename "$file" .md)
                pandoc "$file" -o "dist/$app_name/${filename}.html"

                # 2. 同时将 .md 转换为纯文本 .txt
                #    使用 pandoc 的 plain 输出格式，去除所有标记，生成干净文本
                pandoc "$file" -t plain -o "dist/$app_name/${filename}.txt"
                
                # 3. （可选）保留一份原样拷贝，如果你想要完全保持 MD 原始格式的 .md
                # cp "$file" "dist/$app_name/${filename}.md"
              fi
            done
          done

      # 3. 将生成的 HTML 提交到 GitHub 仓库（关键步骤）
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          # 如果有变更则提交，否则跳过
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate HTML from MD [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      # 4. 同步到 Gitee
      - name: Sync to Gitee
        uses: wearerequired/git-mirror-action@master
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        with:
          source-repo: https://x-access-token:${{ github.token }}@github.com/billwang9527/privacy-policy.git
          destination-repo: git@gitee.com:dotasoft/privacy-policy.git